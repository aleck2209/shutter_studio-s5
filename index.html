        <section  class="moyen_contact">
            <div class="cont_coordonée">
                <h2 class="cont_h2">Nos coordonnées</h2>
                <small class="cont_small">Retrouvez-nous ou écrivez-nous directement</small>

                <div class="ls_contact">
                    <div class="cont_item">
                        <i class="fa-solid fa-envelope icone-doree"></i>
                        <span class="cont_span1">
                            <span class="cont_span2">EMAIL</span>
                            <a class="cont_a" href="">contact@glowultime.com</a>
                        </span>
                    </div>
                    <div class="cont_item">
                        <i class="fa-solid fa-phone icone-doree"></i>
                        <span class="cont_span1">
                            <span class="cont_span2">TELEPHONE</span>
                            <a class="cont_a" href="">+242 06 000 00 00</a>
                        </span>
                    </div>
                    <div class="cont_item">
                         <i class="fa-solid fa-location-dot icone-doree"></i>
                        <span class="cont_span1">
                            <span  class="cont_span2">ADRESSE</span>
                            <a class="cont_a" href="">Avenue de la Paix, Brazzaville, Congo</a>
                        </span>
                    </div>
                    <div class="cont_item">
                         <i class="fa-solid fa-clock icone-doree"></i>
                        <span class="cont_span1">
                            <span class="cont_span2">DISPONIBILITE</span>
                            <a class="cont_a" href="">Lundi - Samedi, 9h00 - 19h00</a>
                        </span>
                    </div>
                </div>
            </div>

            <form class="contact_form" method="post">
                <h2 class="form_h2">Envoyez-nous un message</h2>
                <div class="from_item">
                    <input class="form_inp" type="text" name="name" id="name" placeholder="   Nom complet">
                </div>
                <div class="from_item">
                    <input class="form_inp" type="email" name="email" id="email" placeholder="  Email">
                </div>
                <div class="from_item">
                    <textarea class="form_inp" name="message" id="message" placeholder="  Message"></textarea>
                </div>
                <div class="from_item">
                    <input from_submit type="submit">
                </div>
            </form>
        </section>
        <footer style="background-color: black;">
